theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Paris

title: Carl Hatoum
tagline: AI & Data Scientist · PhD candidate in ML, NLP & IR
description: >-
  PhD candidate at Université Jean Monnet Saint-Étienne.
  AI & Data Scientist at SEGULA Technologies.
  Working on knowledge extraction, information retrieval, and NLP for industrial applications.

url: "https://carlhatoum.github.io"
baseurl: ""

github:
  username: carlhatoum

social:
  name: Carl Hatoum
  email: carlhatoum@gmail.com
  links:
    - https://www.linkedin.com/in/carlhatoum
    - https://github.com/carlhatoum

webmaster_verifications:
  google: I6yJnf5RpPzeY3Z_vp8mu2juEPnC6RffppTovP1eLfY

analytics:
  provider: false

theme_mode: # leave empty to follow system preference

avatar: /assets/img/avatar.jpg

toc: true

comments:
  provider: false

paginate: 10
paginate_path: /page:num/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .sass-cache
  - node_modules
  - package.json
  - Gruntfile.js
  - gulpfile.js
  - vendor
  - Capfile
  - CHANGELOG
  - config
  - log
  - tmp

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
