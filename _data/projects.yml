- title: LDPC Error-Correcting Code
  url: https://github.com/carlhatoum/LDPC
  domain: Communications
  description: >
    MATLAB implementation of Low-Density Parity-Check error-correction algorithms, including belief propagation decoding over sparse factor graphs.
    LDPC codes underpin modern communication standards: Wi-Fi, 5G, DVB.
  links:
    - label: GitHub
      url: https://github.com/carlhatoum/LDPC

