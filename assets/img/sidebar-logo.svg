<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="sc">
      <path d="M 14 84 L 86 82 L 84 24 L 78 13 L 64 10 L 51 11 L 37 13 L 23 18 L 16 33 L 13 52 L 13 70 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#1e2a2e"/>

  <!-- Stone body — irregular trapezoid, wider at bottom -->
  <path d="M 14 84 L 86 82 L 84 24 L 78 13 L 64 10 L 51 11 L 37 13 L 23 18 L 16 33 L 13 52 L 13 70 Z"
        fill="#c47245"/>
  <!-- Stone edge highlight (3D relief) -->
  <path d="M 14 84 L 86 82 L 84 24 L 78 13 L 64 10 L 51 11 L 37 13 L 23 18 L 16 33 L 13 52 L 13 70 Z"
        fill="none" stroke="#d4875c" stroke-width="2" opacity="0.45"/>

  <!-- All engravings clipped to stone -->
  <g clip-path="url(#sc)">

    <!-- Register dividers -->
    <line x1="10" y1="41" x2="90" y2="41" stroke="#8fa8ad" stroke-width="0.9" opacity="0.8"/>
    <line x1="10" y1="62" x2="90" y2="62" stroke="#8fa8ad" stroke-width="0.9" opacity="0.8"/>

    <!-- TOP REGISTER: Hieroglyphs (y 11-41) -->

    <!-- Hawk: standing, facing right -->
    <ellipse cx="20" cy="30" rx="5" ry="9" transform="rotate(-10 20 30)" fill="#8fa8ad" opacity="0.85"/>
    <circle cx="24" cy="19" r="3.2" fill="#8fa8ad" opacity="0.85"/>
    <path d="M 27 19 L 32 21 L 28 23" fill="#8fa8ad" opacity="0.85"/>
    <path d="M 14 37 L 10 41 L 15 38" fill="#8fa8ad" opacity="0.85"/>
    <line x1="17" y1="39" x2="14" y2="42" stroke="#8fa8ad" stroke-width="0.8" opacity="0.85"/>
    <line x1="21" y1="39" x2="19" y2="42" stroke="#8fa8ad" stroke-width="0.8" opacity="0.85"/>

    <!-- Ankh -->
    <ellipse cx="38" cy="23" rx="4" ry="6" fill="none" stroke="#8fa8ad" stroke-width="1" opacity="0.85"/>
    <line x1="38" y1="29" x2="38" y2="40" stroke="#8fa8ad" stroke-width="1" opacity="0.85"/>
    <line x1="34" y1="33" x2="42" y2="33" stroke="#8fa8ad" stroke-width="1" opacity="0.85"/>

    <!-- Door/rectangle -->
    <rect x="47" y="22" width="9" height="11" fill="none" stroke="#8fa8ad" stroke-width="0.9" opacity="0.85"/>
    <line x1="51" y1="33" x2="51" y2="40" stroke="#8fa8ad" stroke-width="0.8" opacity="0.7"/>

    <!-- Pillar -->
    <rect x="62" y="19" width="3" height="21" fill="#8fa8ad" opacity="0.8"/>

    <!-- Seated scribe -->
    <circle cx="74" cy="18" r="3" fill="#8fa8ad" opacity="0.85"/>
    <line x1="74" y1="21" x2="74" y2="31" stroke="#8fa8ad" stroke-width="1.5" opacity="0.85"/>
    <line x1="74" y1="25" x2="82" y2="27" stroke="#8fa8ad" stroke-width="1" opacity="0.85"/>
    <line x1="74" y1="31" x2="69" y2="39" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>
    <line x1="69" y1="39" x2="76" y2="39" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>

    <!-- MIDDLE REGISTER: Phoenician Λ Φ Π Ο Σ (y 42-62) -->

    <!-- Λ -->
    <path d="M 15 61 L 22 43 L 29 61" fill="none" stroke="#8fa8ad" stroke-width="1.3"
          stroke-linejoin="round" opacity="0.85"/>

    <!-- Φ (circle + vertical) -->
    <circle cx="39" cy="52" r="8" fill="none" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>
    <line x1="39" y1="43" x2="39" y2="61" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>

    <!-- Π -->
    <line x1="48" y1="43" x2="60" y2="43" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>
    <line x1="49" y1="43" x2="49" y2="61" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>
    <line x1="59" y1="43" x2="59" y2="61" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>

    <!-- Ο (oval) -->
    <ellipse cx="70" cy="52" rx="7" ry="9" fill="none" stroke="#8fa8ad" stroke-width="1.2" opacity="0.85"/>

    <!-- Σ -->
    <path d="M 86 43 L 79 43 L 84 52 L 79 61 L 86 61" fill="none" stroke="#8fa8ad"
          stroke-width="1.3" stroke-linejoin="round" opacity="0.85"/>

    <!-- BOTTOM REGISTER: ΛΟΓΟΣ (y 63-84) -->
    <text x="50" y="77"
          font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
          font-size="13" font-weight="400" text-anchor="middle" letter-spacing="2"
          fill="#8fa8ad" opacity="0.92">ΛΟΓΟΣ</text>

  </g>
</svg>
